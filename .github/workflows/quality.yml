name: ai-autonomous-quality-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ai-workflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test workflow scripts
        run: bash tests/test-scripts.sh
      - name: Audit autonomous AI workflow
        run: bash scripts/check-ai-autonomy.sh .
      - name: Verify project structure
        run: bash scripts/check-project.sh .
